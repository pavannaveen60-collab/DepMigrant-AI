[project]
name = "depmigrant-ai"
version = "0.1.0"
description = "Autonomous Dependency Migration Engineer"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
authors = [
    {name = "DepMigrant AI Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "httpx>=0.26.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "gitpython>=3.1.0",
    "toml>=0.10.2",
    "pyyaml>=6.0.1",
    "rich>=13.7.0",
    "tenacity>=8.2.0",
    "packaging>=23.2",
    "semver>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "pre-commit>=3.6.0",
]
test = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.26.0",
    "faker>=22.0.0",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["services"]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "UP", "W", "C90", "ANN", "B", "A", "C4", "DTZ", "T10", "T20", "PT", "Q", "SIM", "RUF", "RET", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "PERF", "FLY", "INP", "PIE", "TID", "LOG"]
ignore = ["ANN101", "ANN102", "ANN103", "ARG001", "ARG002", "B008", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "ERA001", "EXE002", "INP001", "PD011", "PGH003", "PLW0601", "PLW0602", "PT004", "PT006", "PT008", "PT012", "PT015", "RUF001", "RUF003", "RUF012", "S101", "S311", "T201", "T203", "TRY003", "TRY300", "TRY301"]
fixable = ["F", "I", "UP", "W", "C90", "B", "A", "C4", "DTZ", "T10", "T20", "PT", "Q", "SIM", "RUF", "RET", "ARG", "PTH", "ERA", "PD", "PGH", "PL", "TRY", "NPY", "PERF", "FLY", "INP", "PIE", "TID", "LOG"]
unfixable = ["ANN", "ARG", "B008", "C901", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "ERA001", "EXE002", "INP001", "PD011", "PGH003", "PLW0601", "PLW0602", "PT004", "PT006", "PT008", "PT012", "PT015", "RUF001", "RUF003", "RUF012", "S101", "S311", "T201", "T203", "TRY003", "TRY300", "TRY301"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
strict_optional = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["packages", "services"]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]